name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private preview signing key
        env:
          PREVIEW_KEY: ${{ secrets.ANDROID_PREVIEW_KEY }}
        run: |
          if [ -n "$PREVIEW_KEY" ]; then
            mkdir -p ~/.android
            printf %s "$PREVIEW_KEY" | base64 --decode > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
          fi
      - run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --no-build-cache
        env:
          RESEARCHDOCK_PREVIEW_STORE: /home/runner/.android/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: researchdock-android-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
