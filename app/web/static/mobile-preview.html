<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研迹 · 手机阅读原型</title><style>
:root{--bg:#f6f5f0;--paper:#fff;--ink:#202c2a;--muted:#78817c;--line:#e5e8e1;--green:#246b53;--tint:#e7f0e9;--accent:#ce794b}*{box-sizing:border-box}body{margin:0;background:#e5e9e3;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #ce794b;outline-offset:3px}.phone{max-width:460px;min-height:100vh;margin:auto;background:var(--bg);padding:0 22px 105px;position:relative}header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 17px}.brand{display:flex;gap:11px;align-items:center}.logo{background:var(--green);color:white;border-radius:12px;padding:5px 11px;font-size:23px;font-weight:700}.name{font-size:20px;font-weight:650;letter-spacing:2px}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--muted)}.icon{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:37px;height:37px}.notice{font-size:11px;color:var(--green);border:1px solid #d6e4d8;border-radius:8px;padding:7px 10px;background:var(--tint)}h1{font-size:30px;letter-spacing:-1px;margin:23px 0 3px;line-height:1.3}h2{font-size:18px;margin:22px 0 10px}.sub,.meta{color:var(--muted);font-size:12px}.search{margin:19px 0 15px;background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:11px 13px;gap:9px}.search input{background:none;border:0;outline:0;width:100%;min-width:0;color:var(--ink)}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 12px;scrollbar-width:none}.chip{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:6px 14px;white-space:nowrap;font-size:12px}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.section{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.section strong{font-size:13px}.plain{border:0;background:none;color:var(--green);padding:5px 0;font-size:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:17px;margin:11px 0}.card button.open{border:0;background:none;padding:0;text-align:left;width:100%}.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--tint);color:var(--green)}.tag.orange{background:#faf0e7;color:#a56b38}.card h3{font-size:17px;margin:0 0 9px;line-height:1.55;font-weight:620}.card p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.8}.foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line)}.bookmark{border:0;background:none;font-size:15px;padding:1px 3px;color:var(--muted)}.bookmark.saved{color:var(--accent)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:12px 10px max(14px,env(safe-area-inset-bottom));z-index:4}nav button{width:25%;border:0;background:none;color:var(--muted);font-size:11px}nav button b{font-size:20px;display:block;font-weight:400;line-height:1.4;margin-bottom:3px}nav button.active{color:var(--green);font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid .card{margin:0}.metric{font-size:24px;font-weight:650;margin-top:7px}.positive{color:var(--green);font-size:11px}.timeline{margin:20px 0;border-left:1px solid #c6d7c9;padding-left:17px}.event{position:relative;margin:0 0 22px}.event:before{content:'';position:absolute;left:-22px;top:8px;width:8px;height:8px;background:var(--green);border:2px solid var(--bg);border-radius:50%}.event h3{font-size:15px;margin:6px 0}.event p{font-size:13px;margin:5px 0;color:var(--muted)}.reading{font-size:15px;line-height:2}.reading p{margin:18px 0}.back{margin:12px 0}.empty{padding:30px 15px;text-align:center;color:var(--muted)}.file{display:flex;align-items:center;gap:13px}.fileicon{background:#f9ece5;color:#ba7551;font-size:11px;font-weight:700;border-radius:9px;padding:12px}.fileinfo{flex:1}.fileinfo h3{font-size:14px;margin:0 0 3px}.divider{border-top:1px solid var(--line);margin:20px 0}.syncbox{display:flex;justify-content:space-between;padding:13px 0}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.smallbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:12px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:12px;z-index:10;max-width:380px;width:max-content}.dark{--bg:#17201d;--paper:#222c27;--ink:#edf1e9;--muted:#a1aea4;--line:#354338;--green:#87b99c;--tint:#2b4233}.dark .chip.active,.dark .logo{color:#17201d}.dark .notice{border-color:var(--line)}@media(min-width:600px){.phone{box-shadow:0 0 60px #263b2a12}} @media(prefers-reduced-motion:no-preference){.card{animation:appear .2s ease}@keyframes appear{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style></head><body><div class="phone" id="phone"><header><div class="brand"><span class="logo">研</span><div><div class="name">研迹</div><div class="eyebrow">RESEARCHDOCK</div></div></div><button class="icon" id="settings" aria-label="阅读与同步设置">☷</button></header><div class="notice">交互原型 · 全部为合成示例 · 未连接云端</div><main id="main"></main></div><nav aria-label="手机主导航" id="nav"></nav><div id="toast" role="status" hidden></div><script>
'use strict';
const articles=[
{id:'demo-01',company:'示例智造',industry:'半导体',title:'三季度设备订单回暖，交付节奏与现金流同步改善',summary:'管理层交流新增了交付计划和回款进展。关注订单兑现情况，以及下一季度应收账款的变化。',time:'10:20',type:'公司交流',key:'交付与回款',date:'2026-10-24',points:['合成数据：前三季度收入 12.4 亿元，同比增长 18.6%。','合成数据：经营活动现金流净额 2.1 亿元，上期为 1.5 亿元。','管理层观点：排产趋于稳定；尚不等同于下一季度收入确认。'],risk:'收入确认时间与客户验收进度可能产生差异。'},
{id:'demo-02',company:'示例新材',industry:'新能源',title:'材料价格企稳后，如何观察毛利率修复的持续性',summary:'本次交流围绕库存成本、产品结构与海外需求展开。原文事实与管理层预期分开呈现。',time:'09:35',type:'行业纪要',key:'价格与库存',date:'2026-10-24',points:['合成数据：收入 8.6 亿元，毛利率 24%。','存货周转情况需结合后续报告期验证。'],risk:'原材料价格与海外需求存在波动。'},
{id:'demo-03',company:'示例智造',industry:'半导体',title:'半年报交流：订单增长，客户验收与回款仍需跟踪',summary:'与最新交流对照，查看此前关注的问题是否已有进展，保留每次判断对应的来源与日期。',time:'08-25',type:'历史调研',key:'订单与验收',date:'2026-08-25',points:['合成数据：上半年收入 7.8 亿元。','合成数据：经营活动现金流净额 1.5 亿元。','当时的待验证问题：客户验收与现金流是否改善。'],risk:'本条是历史记录，请结合最新资料阅读。'},
{id:'demo-04',company:'示例医研',industry:'医药生物',title:'诊断设备更新需求：关注招标节奏与装机后的耗材收入',summary:'保留访谈中的核心观察与信息局限，避免将行业专家判断当成公司已经确认的收入。',time:'昨天',type:'专家交流',key:'设备与耗材',date:'2026-10-23',points:['行业观点：更新需求的落地节奏存在地区差异。','公司事实与行业推测需要进一步核实。'],risk:'专家交流不代表公司正式公告。'}];
const files=[{name:'示例智造 · 三季度交流原件.pdf',type:'PDF',size:'2.4 MB',company:'示例智造'}, {name:'半导体设备行业 · 合成研究报告.pdf',type:'PDF',size:'5.1 MB',company:'行业资料'}, {name:'示例医研 · 专家交流录音.mp3',type:'音频',size:'18.6 MB',company:'示例医研'}];
let tab='feed',industry='全部',query='',savedOnly=false,offline=false,dark=false;const saved=new Set(),read=new Set();let toastTimer;
const main=document.getElementById('main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200);}
function renderNav(){document.getElementById('nav').innerHTML=[['feed','▤','动态'],['industries','◫','行业'],['companies','◷','公司'],['files','▱','原件']].map(([id,icon,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}"><b>${icon}</b>${label}</button>`).join('');}
function card(a){return `<article class="card"><button class="open" data-article="${a.id}"><div class="tags"><span class="tag">${esc(a.industry)}</span><span class="tag orange">${esc(a.type)}</span>${read.has(a.id)?'<span class="meta">已读</span>':''}</div><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p></button><div class="foot"><span class="meta">${esc(a.company)} · ${esc(a.time)}</span><button class="bookmark ${saved.has(a.id)?'saved':''}" data-save="${a.id}" aria-label="${saved.has(a.id)?'取消收藏':'收藏'} ${esc(a.title)}">${saved.has(a.id)?'★':'☆'}</button></div></article>`;}
function render(){renderNav();if(tab==='feed'||tab==='industries'){main.innerHTML=`<h1>${tab==='feed'?'研究动态':'行业观察'}</h1><div class="sub">${offline?'离线体验 · 当前仅显示内置示例':'10 月 24 日，星期六 · 示例资料 4 篇'}</div><label class="search"><span>⌕</span><input id="search" aria-label="搜索示例资料" placeholder="搜索公司、行业、研究内容" value="${esc(query)}"></label><div class="chips">${['全部','半导体','新能源','医药生物'].map(x=>`<button class="chip ${industry===x?'active':''}" data-industry="${x}">${x}</button>`).join('')}</div><div class="section"><strong>${industry==='全部'?'最新研究':industry+' · 研究资料'}</strong><button class="plain" id="saved-filter">${savedOnly?'查看全部':'只看收藏'}</button></div><div id="results"></div>`;renderResults();}
else if(tab==='companies'){main.innerHTML='<h1>公司研究</h1><div class="sub">沿着时间，看清每一次调研的变化</div>'+['示例智造','示例新材','示例医研'].map((name,i)=>`<article class="card"><button class="open" data-company="${name}"><div class="tags"><span class="tag">${['半导体','新能源','医药生物'][i]}</span><span class="meta">DEMO-00${i+1} · 合成标识</span></div><h3>${name} <span style="float:right;color:var(--green)">↗</span></h3><p>${articles.filter(a=>a.company===name).length} 条示例资料 · 调研时间线 / 财务 / 原文</p></button></article>`).join('');}
else{main.innerHTML='<h1>资料原件</h1><div class="sub">PDF 与音频保持原件，不解析、不转写</div>'+files.map((f,i)=>`<article class="card file"><span class="fileicon">${f.type}</span><div class="fileinfo"><h3>${esc(f.name)}</h3><div class="meta">${esc(f.company)} · ${f.size} · 示例占位</div></div><button class="smallbtn" data-file="${i}">查看</button></article>`).join('')+'<p class="meta">原型不包含实际文件。正式版需接入鉴权下载与本地缓存，不把私人原件写入 APK。</p>';}}
function renderResults(){const list=articles.filter(a=>(industry==='全部'||a.industry===industry)&&(!savedOnly||saved.has(a.id))&&(!query||[a.title,a.company,a.industry,a.summary].join(' ').includes(query)));document.getElementById('results').innerHTML=list.map(card).join('')||'<div class="empty">没有符合条件的示例资料。试试取消筛选或收藏一篇。</div>';}
function company(name){main.innerHTML=`<button class="plain back" id="back">← 公司列表</button><div class="tags"><span class="tag">${esc(articles.find(a=>a.company===name).industry)}</span><span class="meta">合成公司</span></div><h1>${esc(name)}</h1><div class="sub">原文与调研观察 · 按发布时间追踪</div>${name==='示例智造'?'<h2>前三季度财务 · 合成数据</h2><div class="grid"><div class="card"><div class="meta">营业收入</div><div class="metric">12.4 <small style="font-size:11px">亿元</small></div><div class="positive">同比 +18.6%</div></div><div class="card"><div class="meta">经营现金流净额</div><div class="metric">2.1 <small style="font-size:11px">亿元</small></div><div class="meta">上半年累计 1.5 亿元</div></div></div><p class="meta">不同累计期间不直接计算增长率；正式版展示接口来源与报告期。</p>':''}<h2>调研时间线</h2><div class="timeline">${articles.filter(a=>a.company===name).map(a=>`<section class="event"><div class="meta">${a.date} · ${a.type}</div><h3>${a.key}</h3><p>${esc(a.summary)}</p><button class="plain" data-article="${a.id}">阅读原文与证据 →</button></section>`).join('')}</div>`;window.scrollTo(0,0);}
function article(id){const a=articles.find(a=>a.id===id);read.add(id);main.innerHTML=`<button class="plain back" id="back">← 返回${tab==='companies'?'公司列表':'资料列表'}</button><div class="tags"><span class="tag">${esc(a.industry)}</span><span class="tag orange">合成资料</span></div><h1 style="font-size:25px;line-height:1.55">${esc(a.title)}</h1><div class="sub" style="margin-top:12px">${esc(a.company)} · ${a.date} · 归档版本 r1</div><div class="divider"></div><h2>研究摘要</h2><p class="reading">${esc(a.summary)}</p><h2>原文要点</h2><div class="reading">${a.points.map(p=>'<p>'+esc(p)+'</p>').join('')}</div><div class="card"><strong>信息局限</strong><p style="margin-top:8px">${esc(a.risk)}</p></div><button class="smallbtn" data-save="${a.id}">${saved.has(a.id)?'★ 已收藏':'☆ 收藏这篇资料'}</button><p class="meta" style="margin-top:20px">演示内容完全合成，不对应真实公司、研究结论或来源。此页不调用模型。</p>`;window.scrollTo(0,0);}
function settings(){main.innerHTML=`<button class="plain back" id="back">← 返回阅读</button><h1>阅读与同步</h1><p class="sub">这是交互演示，未连接 Mac 或阿里云</p><section class="card"><div class="syncbox"><strong>服务连接</strong><span class="tag orange">尚未接入</span></div><p>正式版填写私有服务地址并授权设备。采集凭据与 DeepSeek Key 留在 Mac。</p><div class="setting"><span>离线状态演示</span><button class="smallbtn" id="offline-toggle">${offline?'切回在线演示':'体验离线演示'}</button></div><div class="setting"><span>深色阅读</span><button class="smallbtn" id="dark-toggle">${dark?'关闭':'开启'}</button></div></section><h2>正式版同步边界</h2><p>正文与图片按版本增量同步；原件按需下载。手机打开资料不触发 DeepSeek。</p><p class="meta">原型的离线开关只改变展示状态，并未实现真实缓存、后台同步或消息推送。</p>`;}
document.getElementById('settings').onclick=settings;
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderResults();}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.tab){tab=d.tab;query='';industry='全部';savedOnly=false;render();window.scrollTo(0,0);}else if(d.industry){industry=d.industry;render();}else if(d.article){article(d.article);}else if(d.company){company(d.company);}else if(d.save){if(saved.has(d.save))saved.delete(d.save);else saved.add(d.save);notify(saved.has(d.save)?'已收藏示例资料':'已取消收藏');if(document.getElementById('results'))renderResults();else article(d.save);}else if(d.file!==undefined){notify('这是原件占位；实际下载需接入私有阅读服务');}else if(el.id==='back'){render();window.scrollTo(0,0);}else if(el.id==='saved-filter'){savedOnly=!savedOnly;render();}else if(el.id==='offline-toggle'){offline=!offline;settings();}else if(el.id==='dark-toggle'){dark=!dark;document.getElementById('phone').classList.toggle('dark',dark);document.body.classList.toggle('dark',dark);settings();}});
render();
</script></body></html>
